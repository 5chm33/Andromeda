# rsi-validate.yml — v7.0 (Elicit enforcement contract — 8 CI gates)
#
# Gates:
#   1. typecheck          — tsc --noEmit (BLOCKING — zero errors required)
#   2. test               — pnpm test --run (vitest)
#   3. no-direct-git-push — static check: no module calls git push/commit outside promotionService.ts
#   4. feature-registry   — validate feature_registry.json schema and invocation evidence
#   5. bundle-size        — reject if any chunk exceeds 2MB
#   6. build              — pnpm run build (vite + tsc emit)
#   7. smoke              — start server, hit /health, shut down
#   8. adversarial        — run adversarial acceptance tests (promotion gate bypass attempts)
name: RSI Validate
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
concurrency:
  group: rsi-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: RSI 8-Gate Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Approve build scripts
        run: pnpm approve-builds --all || true
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Gate 1: TypeScript typecheck (BLOCKING — zero errors required)
      - name: Gate 1 — TypeScript typecheck (blocking)
        run: |
          pnpm exec tsc --noEmit 2>&1 | tee /tmp/tsc-output.txt
          ERROR_COUNT=$(grep -c 'error TS' /tmp/tsc-output.txt 2>/dev/null || echo 0)
          echo "TypeScript errors: $ERROR_COUNT"
          echo "## Gate 1: TypeScript Typecheck" >> $GITHUB_STEP_SUMMARY
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "FAILED: $ERROR_COUNT type error(s)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "PASSED: 0 type errors" >> $GITHUB_STEP_SUMMARY
        env:
          NODE_ENV: test

      # Gate 2: Test suite
      - name: Gate 2 — Test suite
        run: pnpm test --run
        env:
          NODE_ENV: test
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'test-stub' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'test-stub' }}

      # Gate 3: No direct git push outside promotionService.ts
      - name: Gate 3 — No direct git push outside promotionService.ts
        run: python3 scripts/check_no_direct_git_push.py

      # Gate 4: Feature registry validation
      - name: Gate 4 — Feature registry validation
        run: python3 scripts/check_feature_registry.py

      # Gate 5: Bundle size budget (2MB per chunk)
      - name: Gate 5 — Bundle size budget (2MB per chunk)
        run: |
          pnpm run build 2>&1 | tee /tmp/build-size-output.txt
          # Extract chunk sizes and check for any > 2048 kB
          python3 -c "
          import re, sys
          with open('/tmp/build-size-output.txt') as f:
              content = f.read()
          # Match lines like: dist/assets/vendor-abc.js  2.50 MB
          oversized = []
          for m in re.finditer(r'(dist/\S+)\s+([\d.]+)\s*(kB|MB|B)', content):
              name, size, unit = m.group(1), float(m.group(2)), m.group(3)
              size_kb = size * 1024 if unit == 'MB' else (size / 1024 if unit == 'B' else size)
              if size_kb > 2048:
                  oversized.append(f'{name}: {size} {unit}')
          if oversized:
              print('FAILED: Chunks exceed 2MB budget:')
              for c in oversized: print(' ', c)
              sys.exit(1)
          print('PASSED: All chunks within 2MB budget')
          "
        env:
          NODE_ENV: production

      # Gate 6: Build
      - name: Gate 6 — Build
        run: pnpm run build
        env:
          NODE_ENV: production

      # Gate 7: Smoke test
      - name: Gate 7 — Smoke test (start server + /health)
        run: |
          node dist/_core/index.js &
          SERVER_PID=$!
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || echo "000")
          kill $SERVER_PID 2>/dev/null || true
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED: /health returned HTTP $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED: /health returned HTTP 200"
        env:
          NODE_ENV: production
          PORT: 3000
          AUTONOMY: "false"
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'test-stub' }}

      # Gate 8: Adversarial acceptance tests
      - name: Gate 8 — Adversarial acceptance tests
        run: pnpm exec vitest run server/tests/adversarial/
        env:
          NODE_ENV: test
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'test-stub' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'test-stub' }}

      # Summary
      - name: Pipeline summary
        if: always()
        run: |
          echo "## RSI Validation Pipeline (v7.0 — 8 gates)" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | TypeScript typecheck (blocking) | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Test suite | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | No direct git push | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Feature registry | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Bundle size budget | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | Build | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 | Smoke test | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 8 | Adversarial tests | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
