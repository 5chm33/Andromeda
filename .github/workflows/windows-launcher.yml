name: Build Windows Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "scripts/launch.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-launcher.yml"

permissions:
  contents: write

jobs:
  package-windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm 11.9.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify cmd.exe pnpm shim invocation
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'Andromeda Launcher Cmd Test'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $shim = Join-Path $testRoot 'pnpm.cmd'
          Set-Content -Path $shim -Value "@echo off`r`necho PNPM_SHIM_OK %*"
          $commandLine = "/d /c call `"$shim`" launch"
          $output = & $env:ComSpec /d /c "call `"$shim`" launch" 2>&1
          $output | Out-Host
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch 'PNPM_SHIM_OK launch') {
            throw "cmd.exe could not invoke a pnpm.cmd shim at a path containing spaces."
          }

      - name: Build project-local launcher executable
        run: >
          dotnet publish launcher/windows/AndromedaProjectLauncher.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output release/project-launcher

      - name: Upload project-local launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-Project-Launcher-Windows-x64
          path: release/project-launcher/Andromeda Launcher.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish project-local launcher release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: project-launcher-v5.0.4
          name: Andromeda Project Launcher v5.0.4
          body: |
            One-click Windows launcher for a downloaded Andromeda project folder.

            Place `Andromeda Launcher.exe` in the root of the same project folder that contains `package.json`, `.env.local`, and `launcher/`. Double-click it to launch that exact local project. The launcher never substitutes a separate bundled project or configuration.

            This launcher requires the local project prerequisites: Node.js 22 LTS and pnpm 11+.
          files: release/project-launcher/Andromeda Launcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
